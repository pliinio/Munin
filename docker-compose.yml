version: "3.9"

services:
  munin:
    build: .
    container_name: munin-dashboard
    ports:
      - "${MUNIN_DASHBOARD_PORT:-5000}:5000"
    volumes:
      - munin-data:/data
      - ./scans:/app/scans
      - ./reports:/app/reports
    environment:
      MUNIN_SECRET_KEY: ${MUNIN_SECRET_KEY}
      MUNIN_DASHBOARD_USER: ${MUNIN_DASHBOARD_USER:-admin}
      MUNIN_DASHBOARD_PASS: ${MUNIN_DASHBOARD_PASS:-changeme}
      MUNIN_SESSION_TIMEOUT: ${MUNIN_SESSION_TIMEOUT:-3600}
      MUNIN_IP_ALLOWLIST: ${MUNIN_IP_ALLOWLIST:-}
      OLLAMA_HOST: http://ollama:11434
      ENABLE_NLP: ${ENABLE_NLP:-true}
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - munin-net

  ollama:
    image: ollama/ollama:latest
    container_name: munin-ollama
    volumes:
      - ollama-models:/root/.ollama
    ports:
      - "11434:11434"
    restart: unless-stopped
    networks:
      - munin-net

volumes:
  munin-data:
  ollama-models:

networks:
  munin-net:
    driver: bridge
